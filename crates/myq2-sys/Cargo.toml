[package]
name = "myq2-sys"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "myq2-rust"
path = "src/main.rs"

[dependencies]
myq2-common = { path = "../myq2-common" }
myq2-client = { path = "../myq2-client" }
myq2-server = { path = "../myq2-server" }
myq2-renderer = { path = "../myq2-renderer" }
socket2 = "0.5"
openal-soft-sys = { path = "../openal-soft-sys" }
crossbeam = { workspace = true }
parking_lot = { workspace = true }

# Window management (replaces SDL3)
winit = { workspace = true }
raw-window-handle = { workspace = true }

# Vulkan surface creation
ash = { workspace = true }
ash-window = { workspace = true }

# Windows platform dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# Linux platform dependencies
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"       # Non-blocking stdin for dedicated server console
arboard = "3"      # Wayland-native clipboard access
